name: Deploy to web server with FTP or SSH

on:
  push: # Trigger on any push, but branch validation will filter
  workflow_dispatch: # Allow manual triggering

jobs:
  deploy:
    uses: electricbookworks/electric-book-deploy-workflow-ftp-ssh/.github/workflows/deploy.yml@v1.2.2
    secrets: inherit
    with:
      setup-command: 'bundle install'
      build-command: 'bundle exec jekyll build --config="_config.yml,_configs/_config.live.yml"'